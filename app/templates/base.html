<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant Self-Order{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <div class="logo">
                    <a href="{{ url_for('web.index') }}">Restaurant Self-Order</a>
                </div>
                <ul class="nav-links">
                    <li><a href="{{ url_for('web.index') }}">Home</a></li>
                    <li><a href="{{ url_for('web.menu') }}">Menu</a></li>
                    <li><a href="{{ url_for('web.orders') }}">Orders</a></li>
                    <li><a href="{{ url_for('web.settings') }}">Settings</a></li>
                    
                    <!-- Auth links - only visible when not logged in -->
                    <li data-auth="guest"><a href="{{ url_for('auth_web.login') }}">Login</a></li>
                    
                    <!-- User dropdown - only visible when logged in -->
                    <li class="dropdown" data-auth="required">
                        <a href="#" class="dropdown-toggle">
                            <span id="user-name">Account</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="{{ url_for('auth_web.profile') }}">Profile</a></li>
                            <li data-role="admin"><a href="{{ url_for('web.settings') }}">Admin</a></li>
                            <li><a href="#" id="logout-button">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; {{ current_year }} Restaurant Self-Order. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
    
    <script>
        // Set up dropdown functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Show username if logged in
            if (Auth.isAuthenticated()) {
                fetch('/api/auth/me', {
                    headers: Auth.getAuthHeaders()
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('user-name').textContent = data.user.username;
                    }
                })
                .catch(error => console.error('Error fetching user info:', error));
            }
            
            // Dropdown toggle
            const dropdowns = document.querySelectorAll('.dropdown');
            dropdowns.forEach(dropdown => {
                const toggle = dropdown.querySelector('.dropdown-toggle');
                const menu = dropdown.querySelector('.dropdown-menu');
                
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    menu.classList.toggle('show');
                });
                
                // Close dropdown when clicking outside
                document.addEventListener('click', function(e) {
                    if (!dropdown.contains(e.target)) {
                        menu.classList.remove('show');
                    }
                });
            });
        });
    </script>
</body>
</html>
